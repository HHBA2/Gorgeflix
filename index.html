<!doctype html><html lang="en"><head><meta charset="utf-8"><title>GORGEFLIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b3d24;--fg:#fff;--card:#115233;--mut:#a9cdb9;--logo:#fff;--logobg:#0b3d24;--ac:#2ecc71;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="classic"]){--bg:#000;--card:#10201a;--logo:#0b5d34;--logobg:#000}}
:root[data-theme="dark"]{--bg:#000;--card:#10201a;--logo:#0b5d34;--logobg:#000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff,system-ui,sans-serif);min-height:100vh}
button,input,select{font:inherit;color:inherit}button{background:var(--ac);color:#04140b;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
button.g{background:var(--card);color:var(--fg)}input,select{background:var(--card);border:1px solid #fff3;border-radius:8px;padding:8px;width:100%;margin:4px 0}
.c{max-width:1100px;margin:auto;padding:16px}.ctr{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;text-align:center;gap:10px}
.box{background:var(--card);border-radius:14px;padding:18px;width:min(380px,92vw);text-align:start}
.row{display:flex;gap:12px;overflow-x:auto;padding:6px 0 14px}.card{flex:0 0 140px;cursor:pointer}
.p{height:200px;border-radius:10px;display:flex;align-items:flex-end;padding:8px;font-weight:700;font-size:14px}
.bd{font-size:12px;color:var(--mut);display:flex;gap:4px;align-items:center;margin-top:4px}.bd svg{width:22px}
nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.md{background:var(--bg);border-radius:14px;padding:18px;width:min(900px,100%);max-height:92vh;overflow:auto}
.sp{display:flex;gap:16px;flex-wrap:wrap}.sp>div{flex:1 1 280px}
.sr{display:flex;justify-content:space-between;background:var(--card);padding:9px 12px;border-radius:8px;margin:5px 0;cursor:pointer}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--card);margin:2px;cursor:pointer;font-size:13px}.chip.on{background:var(--ac);color:#04140b}
.av{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background-size:cover;margin:auto}
.pl{position:relative;background:#000;height:min(60vh,420px);border-radius:12px;color:#fff}.pl .b{position:absolute}
h2{margin:16px 0 4px}small{color:var(--mut)}
</style></head><body><div id="app"></div><script>
const D={en:{sign:"Sign in",up:"Create account",code:"Access code",set:"Settings",mod:"Moderator",sw:"Switch user",play:"Auto-play best source",movies:"Movies",tv:"TV Shows",anime:"Anime"},
ar:{sign:"تسجيل الدخول",up:"إنشاء حساب",code:"رمز الدخول",set:"الإعدادات",mod:"المشرف",sw:"تبديل المستخدم",play:"تشغيل أفضل مصدر",movies:"أفلام",tv:"مسلسلات",anime:"أنمي"}};
let S;try{S=JSON.parse(localStorage.gf)}catch(e){}
S=S||{accs:[],codeReg:"hooy992",cfg:{lang:"en",ac:"#2ecc71",ff:"system-ui",msg:"Welcome to Gorgeflix",sub:"A place For Every Gorg",skip:10,ipos:"br",icol:"#2ecc71",fast:true,auto:false,res:"1080p",ai:true,aiLang:"ar",src:"All",trakt:"",imdb:"",mal:""},addons:["Torrentio","Torrentio TB"]};
let V="splash",acc=null,usr=null,tab="",err="";
const save=()=>{try{localStorage.gf=JSON.stringify(S)}catch(e){}},C=S.cfg,t=k=>D[C.lang][k]||k;if(C.msg=="Welcome to Gorgflix")C.msg="Welcome to Gorgeflix";
const CAT=[["movie","Moonlit Harbor",8.9],["movie","Dust & Gold",6.1],["movie","Static Rain",3.2],["movie","Velvet Nights 18+",5.5,1],["tv","The Last Lantern",7.7],["tv","Hollow Kingdom",4.8],["tv","Salt Road",9.1],["anime","Sky Forge",8.6],["anime","Neon Ronin",7.2],["anime","Tiny Dragons",2.9]];
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0)&65535,7)%360;
function ogre(f,b,m){const eyes=[`<path d="M33 42l9 9m0-9l-9 9M58 42l9 9m0-9l-9 9" stroke="${b}" stroke-width="3"/>`,`<path d="M33 47h10M57 47h10" stroke="${b}" stroke-width="3"/>`,`<circle cx="38" cy="47" r="4" fill="${b}"/><circle cx="62" cy="47" r="4" fill="${b}"/>`,`<rect x="29" y="41" width="19" height="11" rx="3" fill="${b}"/><rect x="52" y="41" width="19" height="11" rx="3" fill="${b}"/>`][m];
const mouth=[`<path d="M36 70q14-10 28 0" stroke="${b}" stroke-width="3" fill="none"/><path d="M50 74v14" stroke="#7bd35a" stroke-width="6"/><circle cx="50" cy="92" r="4" fill="#7bd35a"/>`,`<path d="M38 72q12-5 24 0" stroke="${b}" stroke-width="3" fill="none"/>`,`<path d="M36 67q14 12 28 0" stroke="${b}" stroke-width="3" fill="none"/>`,`<path d="M36 67q14 12 28 0" stroke="${b}" stroke-width="3" fill="none"/><path d="M60 72h26" stroke="#b5651d" stroke-width="5"/><circle cx="87" cy="72" r="3" fill="#f60"/>`][m];
return`<svg viewBox="0 0 100 100"><path d="M18 40L3 26l4 28zM82 40l15-14-4 28z" fill="${f}"/><ellipse cx="50" cy="52" rx="34" ry="36" fill="${f}"/><path d="M30 36q20-8 40 0" stroke="${b}" stroke-width="4" fill="none"/>${eyes}${mouth}<path d="M39 66l3 9 3-9zM55 66l3 9 3-9z" fill="${b}"/></svg>`}
const logo=()=>ogre("var(--logo)","var(--logobg)",2);
const lab=r=>r<4?["مقرق",0]:r<7?["مقرق نسبياً",1]:r<8.5?["جامد",2]:["جامبو",3];
const badge=r=>{const[l,m]=lab(r);return`<span class="bd">${ogre("var(--ac)","var(--bg)",m)}<b>${r}</b> ${l}</span>`};
const seeds=s=>[...s].reduce((a,c)=>a*17+c.charCodeAt(0)&4095,5)+20;
function go(v){V=v;R()}
function R(){document.documentElement.lang=C.lang;document.documentElement.dir=C.lang=="ar"?"rtl":"ltr";document.documentElement.style.setProperty("--ac",C.ac);document.documentElement.style.setProperty("--ff",C.ff);
const f={splash,auth,prof,home,sets,modp}[V];app.innerHTML=f()}
function splash(){setTimeout(()=>V=="splash"&&go("auth"),2200);return`<div class="ctr"><div style="width:160px">${logo()}</div><h1 style="letter-spacing:6px;margin:0">GORGEFLIX</h1></div>`}
function auth(){return`<div class="ctr"><div style="width:90px">${logo()}</div><div class="box"><h2 style="margin-top:0">GORGEFLIX</h2><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password"><input id="k" placeholder="${t("code")} (sign up only)"><p style="color:#ff8a8a">${err}</p><button onclick="login()">${t("sign")}</button> <button class="g" onclick="signup()">${t("up")}</button></div></div>`}
function login(){const a=S.accs.find(x=>x.e==e.value&&x.p==p.value);if(!a)return err="Wrong email or password",R();acc=a;err="";go("prof")}
function signup(){let r=k.value==S.codeReg?"user":k.value=="yalyol908"?"mod":0;if(!r)return err="Invalid code",R();if(!e.value||!p.value||S.accs.some(x=>x.e==e.value))return err="Email missing or taken",R();
const own=r=="mod"&&!S.accs.some(x=>x.owner);acc={e:e.value,p:p.value,role:r,owner:own,users:[],max:3,adultBlock:false,log:[]};S.accs.push(acc);save();err="";go("prof")}
function prof(){const us=acc.users.map((u,i)=>`<div style="text-align:center;cursor:pointer" onclick="pick(${i})"><div class="av" style="background-color:${u.bg};${u.img?`background-image:url(${u.img})`:""}">${u.img?"":u.sym}</div><b style="color:${u.nc}">${u.n}</b></div>`).join("");
const add=acc.users.length<acc.max?`<div class="box" style="margin:14px 0"><b>New user</b> <small>(${acc.users.length}/${acc.max})</small><input id="un" placeholder="Name"><select id="us">${"🧌 👹 🐉 🦊 🎮 🍿 ⭐ 🔥".split(" ").map(x=>`<option>${x}</option>`)}</select>Background <input id="ub" type="color" value="#2e7d4f"> Name color <input id="uc" type="color" value="#ffffff"> Photo <input id="ui" type="file" accept="image/*"><input id="upin" placeholder="Optional PIN lock" maxlength="6"><label><input id="ukid" type="checkbox" style="width:auto"> Kids mode (hides mature content)</label><button onclick="mk()">Create</button></div>`:`<p><small>User limit reached (${acc.max}). A moderator can raise it up to 10.</small></p>`;
return`<div class="c" style="text-align:center"><h2>Who is watching?</h2><div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap">${us}</div><div style="display:flex;justify-content:center">${add}</div><button class="g" onclick="acc=null;go('auth')">Sign out</button></div>`}
function mk(){const u={n:un.value||"Gorg",sym:us.value,bg:ub.value,nc:uc.value,pin:upin.value,kids:ukid.checked,prog:{},wl:[],dl:[],ach:[]},fl=ui.files[0],fin=()=>{acc.users.push(u);save();R()};if(fl){const r=new FileReader;r.onload=()=>{u.img=r.result;fin()};r.readAsDataURL(fl)}else fin()}
function home(){const rows=[["movie",t("movies")],["tv",t("tv")],["anime",t("anime")]].map(([k,n])=>`<h2>${n}</h2><div class="row">${CAT.filter(c=>c[0]==k&&vis(c)).map(c=>`<div class="card" onclick="det('${c[1]}')"><div class="p" style="background:linear-gradient(160deg,hsl(${hue(c[1])} 55% 35%),hsl(${hue(c[1])+40} 60% 14%))">${c[1]}</div>${badge(c[2])}</div>`).join("")}</div>`).join("");
return`<div class="c"><nav><div style="width:46px">${logo()}</div><div><button class="g" onclick="go('prof')">${usr.sym} ${usr.n}</button> <button class="g" onclick="go('sets')">${t("set")}</button>${acc.role=="mod"?` <button onclick="go('modp')">${t("mod")}</button>`:""}</div></nav>
<div style="text-align:center;padding:30px 0"><h1 style="font-size:clamp(32px,7vw,64px);margin:0;font-weight:900">${C.msg}</h1><div style="color:var(--mut);font-size:20px">${C.sub}</div></div>${extra()}${rows}</div>`}
let cur,eps=1,ep=1;
function det(n){cur=CAT.find(c=>c[1]==n);eps=cur[0]=="movie"?1:6;ep=1;ov();if(C.auto)auto()}
function srcs(){const o=[];S.addons.forEach(a=>["2160p","1080p","720p"].forEach(r=>o.push({a,r,s:seeds(cur[1]+ep+a+r),z:r=="2160p"?"14 GB":r=="1080p"?"4.2 GB":"1.6 GB"})));return o.filter(x=>C.src=="All"||x.a==C.src).sort((a,b)=>b.s-a.s)}
function ov(){let o=document.getElementById("o");if(!o){o=document.createElement("div");o.id="o";o.className="ov";document.body.append(o)}
o.innerHTML=`<div class="md"><div style="display:flex;justify-content:space-between"><h2 style="margin:0">${cur[1]}</h2><button class="g" onclick="o.remove()">✕</button></div>${badge(cur[2])}<div class="sp"><div><h3>${eps>1?"Episodes":"Movie"}</h3>${Array.from({length:eps},(_,i)=>`<div class="sr" style="${i+1==ep?"outline:2px solid var(--ac)":""}" onclick="ep=${i+1};C.auto?auto():ov()">${eps>1?"Episode "+(i+1):"Play"}</div>`).join("")}<button onclick="auto()">${t("play")} (${C.res})</button> <button class="g" onclick="tg('wl')">${usr.wl.includes(cur[1])?"✓ In list":"+ My List"}</button> <button class="g" onclick="tg('dl')">${usr.dl.includes(cur[1])?"✓ Downloaded":"⬇ Download"}</button></div>
<div><h3>Sources</h3>${["All",...S.addons].map(a=>`<span class="chip ${C.src==a?"on":""}" onclick="C.src='${a}';save();ov()">${a}</span>`).join("")}${srcs().map((x,i)=>`<div class="sr" onclick="play('${x.a} ${x.r}')"><span>${x.a} · ${x.r} · ${x.z}</span><b>🌱 ${x.s}</b></div>`).join("")}</div></div></div>`}
function auto(){const l=srcs(),m=l.filter(x=>x.r==C.res)[0]||l[0];play(m.a+" "+m.r)}
function play(s){usr.last=cur[1];usr.prog[cur[1]]=Math.min(95,(usr.prog[cur[1]]||0)+25);ach();acc.log.push({u:usr.n,t:cur[1]+(eps>1?" E"+ep:""),w:new Date().toLocaleString()});save();const p=C.ipos,pos=p[0]=="b"?"bottom:70px":"top:14px",sd=p[1]=="r"?"right:14px":"left:14px";
o.innerHTML=`<div class="md" style="background:#000"><div class="pl"><div class="b" style="top:14px;left:14px">${cur[1]} ${eps>1?"E"+ep:""} · ${s} ${C.fast?"⚡ fast profile":""}</div><div class="b" style="top:44px;left:14px;background:#000a;padding:4px 8px;border-radius:6px">${C.ai?"CC AI subtitles ("+C.aiLang+")":"CC off"}</div>
<button class="b" style="${pos};${sd};background:${C.icol}">Skip intro</button><button class="b" style="${p[0]=="b"?"bottom:120px":"top:56px"};${sd};background:${C.icol}" onclick="toast('Recap skipped')">Skip recap</button><div class="b" style="bottom:14px;left:0;right:0;text-align:center"><button class="g" onclick="toast('-${C.skip}s')">⏪ ${C.skip}s</button> <button class="g">⏸</button> <button class="g" onclick="toast('+${C.skip}s')">${C.skip}s ⏩</button> <button class="g" onclick="if(ep<eps){ep++;ov()}">Next ep ⏭</button> <button class="g" onclick="window.gorge&&window.streamUrl?gorge.vlc(streamUrl):toast('Demo: VLC hand-off needs a real stream URL')">VLC ↗</button> <button class="g" onclick="toast('Casting to Chromecast / AirPlay…')">📺 Cast</button> <button class="g" onclick="ov()">✕</button></div></div></div>`}
function toast(m){const d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 14px;border-radius:8px;z-index:99";document.body.append(d);setTimeout(()=>d.remove(),1400)}
const fld=(l,k,t2="text")=>`<label>${l}<input type="${t2}" value="${C[k]}" onchange="C.${k}=this.value;save()"></label>`;
function sets(){return`<div class="c"><button class="g" onclick="go('home')">← Back</button><h1>${t("set")}</h1><div class="sp"><div class="box">
<h3>Interface</h3><label>Language <select onchange="C.lang=this.value;save();R()"><option value="en" ${C.lang=="en"?"selected":""}>English</option><option value="ar" ${C.lang=="ar"?"selected":""}>العربية</option></select></label>
<label>Theme <select onchange="document.documentElement.dataset.theme=this.value"><option value="classic">Classic (white ogre / green)</option><option value="dark">Dark (green ogre / black)</option></select></label>
<label>Accent <input type="color" value="${C.ac}" onchange="C.ac=this.value;save();R()"></label><label>Font <select onchange="C.ff=this.value;save();R()">${["system-ui","Georgia,serif","'Courier New',monospace","Impact,sans-serif"].map(f=>`<option ${C.ff==f?"selected":""}>${f}</option>`)}</select></label>
${fld("Welcome message","msg")}${fld("Tagline","sub")}</div>
<div class="box"><h3>Player</h3><label>Skip seconds <input type="number" value="${C.skip}" onchange="C.skip=+this.value;save()"></label><label>Skip-intro position <select onchange="C.ipos=this.value;save()">${["tl","tr","bl","br"].map(x=>`<option ${C.ipos==x?"selected":""}>${x}</option>`)}</select></label><label>Button color <input type="color" value="${C.icol}" onchange="C.icol=this.value;save()"></label>
<label><input type="checkbox" style="width:auto" ${C.ai?"checked":""} onchange="C.ai=this.checked;save()"> AI subtitles when none in my language</label>${fld("AI subtitle language","aiLang")}
<label><input type="checkbox" style="width:auto" ${C.fast?"checked":""} onchange="C.fast=this.checked;save()"> Ultra-fast torrent profile</label>
<label><input type="checkbox" style="width:auto" ${C.auto?"checked":""} onchange="C.auto=this.checked;save()"> Auto-select most seeded source</label><label>Preferred resolution <select onchange="C.res=this.value;save()">${["2160p","1080p","720p"].map(x=>`<option ${C.res==x?"selected":""}>${x}</option>`)}</select></label></div>
<div class="box"><h3>Addons (shared by all users)</h3>${S.addons.map((a,i)=>`<div class="sr">${a}<span onclick="S.addons.splice(${i},1);save();R()">✕</span></div>`).join("")}<input id="ad" placeholder="Paste Stremio addon manifest URL"><button onclick="if(ad.value){S.addons.push(ad.value.replace(/https?:\\/\\//,'').split('/')[0]);save();R()}">Add / import</button>
<h3>Linked accounts</h3>${fld("Trakt","trakt")}${fld("IMDb","imdb")}${fld("MyAnimeList","mal")}</div>${more()}</div></div>`}
function modp(){const me=acc;return`<div class="c"><button class="g" onclick="go('home')">← Back</button><h1>${t("mod")}</h1><div class="box" style="width:100%"><b>Regular access code</b><input id="nc" value="${S.codeReg}"><button onclick="S.codeReg=nc.value;save();toast('Code changed')">Change</button></div>
${S.accs.map((a,i)=>{const ok=!a.owner&&(me.owner||a.role!="mod")&&a!=me;return`<div class="box" style="width:100%;margin-top:10px"><b>${a.e}</b> · ${a.owner?"Main moderator":a.role} · users ${a.users.length}/${a.max}
<div><small>${a.log.slice(-4).map(l=>`${l.u}: ${l.t} (${l.w})`).join("<br>")||"No watch history"}</small></div>${ok?`<button class="g" onclick="S.accs[${i}].adultBlock=!S.accs[${i}].adultBlock;save();R()">Adult content: ${a.adultBlock?"restricted":"allowed"}</button> <button class="g" onclick="S.accs[${i}].max=Math.min(10,S.accs[${i}].max+1);save();R()">User limit +1 (max 10)</button>${me.owner?` <button class="g" onclick="S.accs.splice(${i},1);save();R()">Delete</button>`:""}`:"<small>Protected</small>"}</div>`}).join("")}</div>`}
const vis=c=>!(c[3]&&(acc.adultBlock||usr.kids)),ico=n=>CAT.find(c=>c[1]==n);
const card=(c,x)=>`<div class="card" onclick="det('${c[1]}')"><div class="p" style="background:linear-gradient(160deg,hsl(${hue(c[1])} 55% 35%),hsl(${hue(c[1])+40} 60% 14%))">${c[1]}</div>${x||badge(c[2])}</div>`;
const rowx=(t2,l,f)=>l.length?`<h2>${t2}</h2><div class="row">${l.map(c=>card(c,f&&f(c))).join("")}</div>`:"";
function extra(){const P=usr.prog,L=n=>n.map(ico).filter(x=>x&&vis(x)),last=usr.last&&ico(usr.last),rec=last?CAT.filter(c=>c[0]==last[0]&&c!=last&&c[2]>=6&&vis(c)):[],up=CAT.filter(c=>c[0]!="movie"&&vis(c));
return rowx("Continue watching",L(Object.keys(P)),c=>`<div style="height:5px;background:#fff3;border-radius:3px;margin-top:6px"><div style="height:5px;width:${P[c[1]]}%;background:var(--ac);border-radius:3px"></div></div>`)+rowx("My List",L(usr.wl))+rowx("Downloads (offline)",L(usr.dl),()=>'<span class="bd">⬇ Available offline</span>')+(last?rowx("Because you watched "+last[1],rec):"")+rowx("Coming up",up,c=>`<span class="bd">📅 ${new Date(Date.now()+(hue(c[1])%14+1)*864e5).toDateString().slice(0,10)}</span>`)}
function pick(i){const u=acc.users[i];if(u.pin&&prompt("PIN")!=u.pin)return toast("Wrong PIN");u.prog=u.prog||{};u.wl=u.wl||[];u.dl=u.dl||[];u.ach=u.ach||[];usr=u;go("home")}
function gain(n){if(!usr.ach.includes(n)){usr.ach.push(n);toast("🏆 "+n)}}
function ach(){gain("First Bite");if(Object.keys(usr.prog).length>=3)gain("Binge Gorg");if(cur[2]>=8.5)gain("Jumbo Taste");if(cur[2]<4)gain("Strong Stomach")}
function tg(k){const a=usr[k],i=a.indexOf(cur[1]);i<0?a.push(cur[1]):a.splice(i,1);if(i<0)gain(k=="wl"?"Swamp Librarian":"Offline Ogre");save();ov()}
function more(){return`<div class="box"><h3>Stremio</h3><small>Imports your addons. Your password goes only to Stremio and is not saved.</small><input id="se" placeholder="Stremio email"><input id="sp" type="password" placeholder="Stremio password"><button onclick="stremio()">Import addons</button></div><div class="box"><h3>Sync between devices</h3><textarea id="sy" style="width:100%;height:60px"></textarea><button onclick="sy.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))))">Export code</button> <button class="g" onclick="try{S=JSON.parse(decodeURIComponent(escape(atob(sy.value))));save();location.reload()}catch(e){toast('Bad code')}">Import code</button></div><div class="box"><h3>Achievements</h3>${(usr.ach.length?usr.ach:["None yet"]).map(a=>`<span class="chip on">🏆 ${a}</span>`).join("")}</div>`}
async function stremio(){const J=(u,b)=>fetch("https://api.strem.io/api/"+u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json());try{const l=await J("login",{type:"Login",email:se.value,password:sp.value}),a=await J("addonCollectionGet",{type:"AddonCollectionGet",authKey:l.result.authKey,update:true}),n=a.result.addons.map(x=>x.manifest.name);S.addons=[...new Set([...S.addons,...n])];S.addonUrls=a.result.addons.map(x=>x.transportUrl);save();R();toast("Imported "+n.length+" addons")}catch(e){toast("Import failed. It works in the downloaded site or Mac app, not in this preview.")}}
R();</script></body></html>
