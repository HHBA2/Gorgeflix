.p i{display:block;aspect-ratio:2/3;border-radius:var(--r);background:var(--card) center/cover;font-style:normal;font-size:12px;padding:8px;color:var(--mu);transition:transform .15s}

nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}

nav .pb{display:none}
.in{display:block;width:calc(100% - 32px);margin:8px 16px;padding:12px;border-radius:var(--r);border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}

.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}.chips.w{flex-wrap:wrap}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sw{width:34px;height:34px;border-radius:99px;border:2px solid var(--bd);flex:none;cursor:pointer}
.sel{display:flex;gap:10px;align-items:center;padding:6px 16px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;display:none;padding:env(safe-area-inset-top) 0 40px}.ov.on{display:block}
.dw{max-width:900px;margin:0 auto}
.hero{height:210px;background:var(--card) center/cover;position:relative}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg))}
.x{position:fixed;top:calc(10px + env(safe-area-inset-top));inset-inline-start:12px;z-index:12;width:38px;height:38px;border-radius:99px;border:0;background:#0009;color:#fff;font-size:20px;cursor:pointer}
.st{display:block;width:calc(100% - 32px);margin:8px 16px;text-align:start;white-space:pre-line;padding:12px;border-radius:var(--r);border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.st small{display:block;color:var(--mu);margin-top:4px}.st:disabled{opacity:.5}
select{margin:0 16px;padding:8px;border-radius:10px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font:inherit}
#pl{z-index:20;background:#000;padding:0}#pl video{width:100%;height:100%;object-fit:contain}
.pt{position:absolute;top:env(safe-area-inset-top);inset-inline:0;display:flex;gap:8px;align-items:center;padding:10px 12px;z-index:3;background:linear-gradient(#000a,transparent)}
.cm{position:absolute;top:calc(60px + env(safe-area-inset-top));inset-inline-start:12px;width:min(320px,90%);max-height:60%;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);z-index:4}
.cm .st{width:calc(100% - 16px);margin:6px 8px}
.sb{position:absolute;inset-inline:6%;text-align:center;pointer-events:none;z-index:2;line-height:1.5;white-space:pre-line}
.auth{max-width:380px;margin:0 auto;padding:40px 0}
.pg{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;padding:20px}
.pf{width:104px;text-align:center;cursor:pointer;background:none;border:0;color:var(--tx);font:inherit}
.av{display:inline-grid;place-items:center;font-style:normal;color:#fff;flex:none;overflow:hidden}.pf .av{margin-bottom:6px}
input[type=range]{width:calc(100% - 32px);margin:4px 16px;accent-color:var(--ac)}
input[type=color]{width:44px;height:36px;border:0;background:none;padding:0}
.ic5{display:flex;gap:8px;padding:0 16px;flex-wrap:wrap}.ic5 input{width:56px;padding:8px;text-align:center;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
.em{font-size:22px!important;padding:4px 8px!important}
.sc{max-width:680px}
@media(min-width:900px){
 body,body.nt{padding:0 0 30px;padding-inline-start:230px}
 nav,nav.top{top:0;bottom:0;inset-inline:auto;inset-inline-start:0;width:230px;flex-direction:column;border:0;border-inline-end:1px solid var(--bd);padding:18px 12px;gap:4px}
 nav button{flex:none;display:flex;align-items:center;gap:12px;font-size:15px;padding:10px 14px;border-radius:var(--r);text-align:start}

 .card.n{width:auto}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.sk{flex:none;width:var(--pw);aspect-ratio:2/3;border-radius:var(--r);background:linear-gradient(100deg,var(--card) 30%,color-mix(in srgb,var(--card),#fff 10%) 50%,var(--card) 70%) 0 0/300% 100%;animation:sh 1.2s infinite linear}

.pt{overflow-x:auto;scrollbar-width:none}
